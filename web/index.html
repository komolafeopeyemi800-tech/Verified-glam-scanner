<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Verified Glam — AI beauty analysis. Upload a photo, get personalized insights.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Verified Glam">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Verified Glam</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #vg-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #F6E3E3;
      color: #872B3F;
      font-family: system-ui, sans-serif;
      z-index: 9999;
      padding: 1.5rem;
      text-align: center;
    }
    #vg-loading p { margin: 0; font-size: 1rem; }
    #vg-loading small { color: #6b4a52; max-width: 28rem; }
    #vg-loading.error { background: #fff5f5; color: #8b1a1a; }
  </style>
  <div id="vg-loading">
    <p><strong>Loading Verified Glam…</strong></p>
    <small id="vg-loading-hint">First load may take a moment while the app starts.</small>
  </div>
  <script>
    (function () {
      var loading = document.getElementById('vg-loading');
      var hint = document.getElementById('vg-loading-hint');
      var bootFailed = false;

      function showError(msg) {
        if (!loading || bootFailed) return;
        bootFailed = true;
        loading.classList.add('error');
        loading.innerHTML = '<p><strong>Could not load the app</strong></p><small>' + msg + '</small>';
      }
      window.__vgShowBootError = showError;

      window.addEventListener('flutter-first-frame', function () {
        if (loading) loading.remove();
      });

      window.addEventListener('error', function (e) {
        var msg = e.message || 'Unknown error';
        if (msg.indexOf('PasskeyAuthenticator') >= 0 || msg.indexOf("'init'") >= 0) {
          msg = 'Passkeys web SDK failed to load. Ensure js/passkeys-bundle.js is present in the deployed build.';
        }
        showError(msg + ' Press Ctrl+Shift+R to hard refresh.');
      });

      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && (e.reason.message || e.reason.toString());
        if (reason) showError(reason);
      });

      setTimeout(function () {
        if (loading && document.body.contains(loading) && !bootFailed) {
          hint.textContent = 'Still loading… large first download can take 1–2 minutes on slow networks.';
        }
      }, 45000);

      setTimeout(function () {
        if (loading && document.body.contains(loading) && !bootFailed) {
          showError(
            'Startup timed out. Open DevTools → Network and confirm flutter_bootstrap.js and main.dart.js return 200. ' +
            'In Cloudflare: build output must be build/web (not web/), deploy command must be empty. ' +
            'Then clear site data for this host and reload in Chrome or Edge.'
          );
        }
      }, 180000);

      // Stale Flutter service workers cause infinite loading on static hosts.
      var swKey = 'vg-sw-cleared-v2';
      if (!sessionStorage.getItem(swKey)) {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
        if (window.caches) {
          caches.keys().then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); });
        }
        sessionStorage.setItem(swKey, '1');
      }

      function checkAsset(path, help) {
        fetch(path, { method: 'HEAD', cache: 'no-store' }).then(function (res) {
          if (!res.ok && !bootFailed) {
            showError(path + ' returned HTTP ' + res.status + '. ' + help);
          }
        }).catch(function () {
          if (!bootFailed) showError('Could not reach ' + path + '. ' + help);
        });
      }

      checkAsset(
        'flutter_bootstrap.js',
        'Cloudflare is probably serving the web/ source folder instead of build/web/. Set Build output directory to build/web and remove any deploy command.'
      );
      setTimeout(function () {
        checkAsset('main.dart.js', 'Flutter build output is missing from the deployed site.');
      }, 3000);
    })();
  </script>
  <script src="js/passkeys-bundle.js"></script>
  <script src="flutter_bootstrap.js" async onerror="window.__vgShowBootError && window.__vgShowBootError('flutter_bootstrap.js failed to load. Deploy build/web, not web/.')"></script>
</body>
</html>
